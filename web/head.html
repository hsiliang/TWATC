<title>臺灣防空識別區航情圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ── tokens ─────────────────────────────────────────────────────────────── */
:root{
  color-scheme: dark;
  --ground:#070b10; --panel:#0e151d; --panel-2:#16202b; --panel-3:#1d2936;
  --line:#233040; --line-2:#2f4256;
  --ink:#e8eef4; --ink-2:#93a4b4; --ink-3:#61728350;
  --ink-mid:#617283;
  --ac:#f5b400; --ac-sel:#ffffff; --ac-gnd:#6b7d8e;
  --adiz:#e05a4e; --fir:#4f9ee0; --awy:#3a5codes;
  --awy:#33506a; --wpt:#3e566b; --apt:#cdd8e2;
  --land:#141e29; --coast:#42596d;
  --good:#3ecf8e; --warn:#f5b400; --crit:#e05a4e;
  --ui:"Archivo","PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --shadow:0 2px 6px rgba(0,0,0,.45),0 16px 40px rgba(0,0,0,.5);
}
:root[data-theme="light"]{
  color-scheme: light;
  --ground:#eef1f4; --panel:#ffffff; --panel-2:#f2f5f8; --panel-3:#e6ebf0;
  --line:#d3dae1; --line-2:#bcc7d1;
  --ink:#0d141b; --ink-2:#4a5a68; --ink-3:#7c8c9a50;
  --ink-mid:#7c8c9a;
  --ac:#c98500; --ac-sel:#0d141b; --ac-gnd:#8496a6;
  --adiz:#c9372c; --fir:#2a78d6; --awy:#93a8bd; --wpt:#a4b5c4; --apt:#2c3944;
  --land:#dde4eb; --coast:#9db0c0;
  --shadow:0 1px 3px rgba(13,20,27,.10),0 12px 32px rgba(13,20,27,.12);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--ui);
     font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%;overflow:hidden}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fir);outline-offset:1px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── shell ──────────────────────────────────────────────────────────────── */
#app{display:grid;grid-template-rows:auto 1fr;height:100vh;height:100svh}
.rail{display:flex;align-items:center;gap:.5rem;padding:.4rem .7rem;
      background:var(--panel);border-bottom:1px solid var(--line);z-index:20;
      position:relative}
.brand{display:flex;align-items:baseline;gap:.45rem;margin-right:.2rem;white-space:nowrap}
.brand b{font-size:.98rem;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:.66rem;color:var(--ink-mid);letter-spacing:.09em;text-transform:uppercase}
.search{position:relative;flex:0 1 220px;min-width:110px}
.search input{width:100%;background:var(--panel-2);border:1px solid var(--line);
  border-radius:5px;padding:.28rem .55rem .28rem 1.6rem;font-size:.82rem;font-family:var(--mono)}
.search svg{position:absolute;left:.45rem;top:50%;transform:translateY(-50%);
  width:.8rem;height:.8rem;opacity:.5;pointer-events:none}
.stat{font-family:var(--mono);font-size:.72rem;color:var(--ink-2);white-space:nowrap;
      border:1px solid var(--line);border-radius:4px;padding:.18rem .42rem}
.stat b{color:var(--ink);font-weight:600}
.stat.live{color:var(--good);border-color:#3ecf8e55}
.stat.demo{color:var(--warn);border-color:#f5b40055}
.dot{display:inline-block;width:.38rem;height:.38rem;border-radius:50%;background:currentColor;
     margin-right:.28rem;vertical-align:.04rem}
.stat.live .dot{animation:blip 2.2s ease-in-out infinite}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.2}}
.sp{flex:1 1 auto}
.ib{background:var(--panel-2);border:1px solid var(--line);border-radius:5px;
    padding:.26rem .5rem;font-size:.78rem;cursor:pointer;white-space:nowrap}
.ib:hover{background:var(--panel-3)}
.ib[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}

.body{position:relative;overflow:hidden;background:var(--ground)}
#scope{position:absolute;inset:0;touch-action:none}

/* ── flight panel ───────────────────────────────────────────────────────── */
.fp{position:absolute;top:10px;left:10px;width:310px;max-height:calc(100% - 20px);
    overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;
    box-shadow:var(--shadow);z-index:12}
.fp[hidden]{display:none}
.fp header{display:flex;align-items:flex-start;gap:.5rem;padding:.7rem .8rem .6rem}
.fp .cs{font-family:var(--mono);font-size:1.3rem;font-weight:600;letter-spacing:.01em;
        line-height:1.05}
.fp .sub{font-size:.74rem;color:var(--ink-mid);font-family:var(--mono);margin-top:.12rem}
.fp .x{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--ink-mid);
       font-size:1.1rem;line-height:1;padding:.1rem .25rem}
.route{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.4rem;
       padding:.55rem .8rem;background:var(--panel-2);border-block:1px solid var(--line)}
.route .code{font-family:var(--mono);font-size:1.22rem;font-weight:600;line-height:1.1}
.route .nm{font-size:.68rem;color:var(--ink-mid);line-height:1.25;
           overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.route .arr{color:var(--ink-mid);font-size:1rem}
.route .to{text-align:right}
.grid{display:grid;grid-template-columns:repeat(3,1fr)}
.cell{padding:.45rem .8rem;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.cell:nth-child(3n){border-right:0}
.cell k{display:block;font-size:.6rem;letter-spacing:.11em;text-transform:uppercase;
        color:var(--ink-mid);font-weight:600}
.cell v{display:block;font-family:var(--mono);font-size:.92rem;font-variant-numeric:tabular-nums}
.cell v small{font-size:.68rem;color:var(--ink-mid);margin-left:.12rem}
.freqbox{padding:.6rem .8rem;border-bottom:1px solid var(--line);border-left:3px solid var(--fir)}
.freqbox.none{border-left-color:var(--ink-mid)}
.freqbox .v{font-family:var(--mono);font-size:1.45rem;font-weight:600;line-height:1.1;
            font-variant-numeric:tabular-nums}
.freqbox .v small{font-size:.8rem;font-weight:500;color:var(--ink-2);margin-left:.2rem}
.freqbox .u{font-size:.74rem;color:var(--ink-2);margin-top:.1rem}
.note{padding:.5rem .8rem;font-size:.72rem;color:var(--ink-mid)}

/* ── layer bar ──────────────────────────────────────────────────────────── */
.bar{position:absolute;left:10px;bottom:10px;display:flex;gap:.3rem;flex-wrap:wrap;
     align-items:center;z-index:10;max-width:calc(100% - 20px)}
.chip{background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(8px);
      border:1px solid var(--line);border-radius:5px;padding:.25rem .5rem;font-size:.75rem;
      color:var(--ink-2);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chip i{display:inline-block;width:.55rem;height:.55rem;border-radius:2px;margin-right:.3rem;
        vertical-align:-1px}
.attrib{position:absolute;right:8px;bottom:8px;font-size:.62rem;color:var(--ink-mid);
        background:color-mix(in srgb,var(--ground) 70%,transparent);padding:.1rem .3rem;
        border-radius:3px;z-index:9}

/* ── settings sheet ─────────────────────────────────────────────────────── */
.sheet{position:absolute;top:10px;right:10px;width:290px;max-height:calc(100% - 20px);
       overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;
       box-shadow:var(--shadow);z-index:14;padding:.8rem}
.sheet[hidden]{display:none}
.sheet h3{margin:0 0 .4rem;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;
          color:var(--ink-mid);font-weight:700}
.sheet h3:not(:first-child){margin-top:.9rem}
.sheet p{margin:.3rem 0;font-size:.73rem;color:var(--ink-mid)}
.sheet input[type=text],.sheet input[type=password],.sheet select{width:100%;
  background:var(--panel-2);border:1px solid var(--line);border-radius:5px;
  padding:.28rem .45rem;font-size:.78rem;font-family:var(--mono)}
.sheet label.sw{display:flex;align-items:center;justify-content:space-between;gap:.5rem;
  font-size:.8rem;color:var(--ink-2);cursor:pointer;padding:.14rem 0}
.sheet code{font-family:var(--mono);font-size:.7rem;color:var(--ink-2)}
.row{display:flex;gap:.3rem;margin-top:.35rem}

/* ── responsive ─────────────────────────────────────────────────────────── */
@media (max-width:860px){
  .fp{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;max-height:58svh;
      border-radius:13px 13px 0 0;border-bottom:0}
  .sheet{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;max-height:70svh;
         border-radius:13px 13px 0 0}
  .bar{bottom:auto;top:8px;left:8px}
  .brand span{display:none}
  .search{flex:1 1 90px}
}
@media (max-width:430px){
  .rail{padding:.35rem .5rem;gap:.35rem}
  .brand b{font-size:.88rem}
  .fp .cs{font-size:1.15rem}
}
.fallback{padding:2rem;max-width:44rem}
</style>
